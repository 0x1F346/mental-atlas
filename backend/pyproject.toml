[project]
name = "atlas"
version = "0.1.0"
description = "Mental Atlas backend: API, worker and pipeline"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.14.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.44.12",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["atlas/domain/generated", "atlas/db/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"atlas/pipeline/fake_extraction.py" = ["E501"]
"atlas/pipeline/test_data.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
files = ["atlas", "tests"]

[[tool.mypy.overrides]]
module = ["atlas.domain.*", "atlas.pipeline.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.11",
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]
