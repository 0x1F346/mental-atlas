# Local infrastructure only. The API, worker and web app run on the host (see Makefile).
# Credentials here are for local development and are not secrets.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: atlas_owner
      POSTGRES_PASSWORD: atlas_owner
      POSTGRES_DB: atlas
    ports:
      - "${ATLAS_PG_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_owner -d atlas"]
      interval: 2s
      timeout: 3s
      retries: 30

  # MinIO left Docker Hub; Chainguard publishes a maintained build (D-005).
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlas-local-secret
    ports:
      - "${ATLAS_S3_PORT:-9100}:9000"
      - "${ATLAS_S3_CONSOLE_PORT:-9101}:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
